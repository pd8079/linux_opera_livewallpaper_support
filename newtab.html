<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GX Local Live Wallpaper</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="is-fallback">
  <div class="visual-stage" aria-hidden="true">
    <div class="fallback-art" id="fallback-art">
      <div class="fallback-grid"></div>
      <div class="fallback-orb fallback-orb-one"></div>
      <div class="fallback-orb fallback-orb-two"></div>
    </div>
    <video id="wallpaper-video" class="wallpaper-video" playsinline loop preload="auto" aria-hidden="true"></video>
    <div class="visual-vignette"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="newtab.html" aria-label="GX Local Live Wallpaper home">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span>GX <strong>LIVE</strong></span>
    </a>
    <div class="topbar-actions">
      <span class="connection-badge"><span class="status-dot" aria-hidden="true"></span>Local only</span>
      <button class="button button-quiet" id="toggle-panel" type="button" aria-expanded="true" aria-controls="control-panel">Controls</button>
    </div>
  </header>

  <main>
    <section class="control-panel" id="control-panel" aria-labelledby="panel-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Opera GX / Linux</p>
          <h1 id="panel-title">Your new tab, in motion.</h1>
        </div>
        <button class="icon-button panel-close" id="close-panel" type="button" aria-label="Close controls">×</button>
      </div>

      <p class="status-message" id="wallpaper-status" role="status" aria-live="polite">Loading your wallpaper…</p>

      <div class="primary-controls" aria-label="Playback controls">
        <button class="button button-primary" id="play-pause" type="button" aria-pressed="false">Play</button>
        <button class="button" id="mute-toggle" type="button" aria-pressed="true">Unmute</button>
        <button class="button" id="reset-wallpaper" type="button">Use fallback</button>
      </div>

      <div class="import-row">
        <label class="button import-button" for="video-import">Import MP4 / WebM
          <input id="video-import" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple>
        </label>
        <span class="field-help">Files stay in this browser profile.</span>
      </div>
      <progress id="import-progress" class="import-progress" max="1" value="0" hidden aria-label="Import progress"></progress>

      <div class="panel-section">
        <div class="section-heading">
          <h2>Wallpaper library</h2>
          <span class="section-count" id="wallpaper-count">1</span>
        </div>
        <ul class="wallpaper-list" id="wallpaper-list" aria-label="Wallpaper choices"></ul>
        <button class="button button-danger button-small" id="remove-wallpaper" type="button" disabled>Remove selected video</button>
      </div>

      <details class="panel-section settings-section" open>
        <summary>Playback &amp; appearance</summary>
        <div class="settings-grid">
          <label class="setting-control" for="volume-control">
            <span>Volume <output id="volume-value" for="volume-control">40%</output></span>
            <input id="volume-control" type="range" min="0" max="1" step="0.05" value="0.4">
          </label>
          <label class="setting-control" for="scale-control">
            <span>Video scaling</span>
            <select id="scale-control">
              <option value="cover">Fill screen</option>
              <option value="contain">Show all</option>
              <option value="fill">Stretch</option>
            </select>
          </label>
          <label class="setting-control" for="speed-control">
            <span>Playback speed</span>
            <select id="speed-control">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1">1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <label class="setting-control accent-control" for="accent-control">
            <span>Accent color</span>
            <input id="accent-control" type="color" value="#ff1b8d">
          </label>
        </div>
        <p class="motion-note" id="motion-note">Animation starts muted. Reduced-motion preferences are respected.</p>
      </details>

      <footer class="panel-footer">
        <span id="storage-note">IndexedDB readying…</span>
        <span>MP4/WebM · no downloads</span>
      </footer>
    </section>
  </main>
</body>
</html>
